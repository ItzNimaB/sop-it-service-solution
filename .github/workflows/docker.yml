name: Deploy Docker

on:
  push:
    branches:
      - main
    paths:
      - "backend/**" # So far, only the backend is being deployed via Docker
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: [self-hosted, sop-server]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check if running in act
        id: is_act
        run: |
          if [ "$ACT" = "true" ]; then
            echo "act=true" >> "$GITHUB_OUTPUT"
          else
            echo "act=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        run: docker build -t sop-backend:latest ./backend

      - name: Run Docker container
        if: steps.is_act.outputs.act == 'false'
        run: |
          docker rm sop-backend -f || true
          docker run -d --name sop-backend --restart unless-stopped --env-file "$HOME/.env" --network="host" sop-backend:latest

      - name: Remove dangling images
        if: steps.is_act.outputs.act == 'false'
        run: docker image prune -f
