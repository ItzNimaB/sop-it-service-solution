name: Deploy Frontend (Student View)

on:
  push:
    branches:
      - main
    paths:
      - "frontend/student-view/**"
  workflow_dispatch:

concurrency:
  group: deploy-student-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: [self-hosted, sop-server]

    defaults:
      run:
        working-directory: frontend/student-view

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if running in act
        id: is_act
        run: |
          if [ "$ACT" = "true" ]; then
            echo "act=true" >> "$GITHUB_OUTPUT"
          else
            echo "act=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Deploy to web root
        if: steps.is_act.outputs.act == 'false'
        run: |
          TARGET=/var/www/lager/student-view
          mkdir -p "$TARGET"
          find "$TARGET" -mindepth 1 -delete
          cp -r dist/. "$TARGET/"
